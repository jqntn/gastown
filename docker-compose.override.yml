services:
  gastown:
    container_name: ${GT_CONTAINER:-gastown-sandbox}
    volumes: !override
      - agent-home:/home/agent
      - gt:/gt
      - dolt-data:/gt/.dolt-data
    ports: !override
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
      - "127.0.0.1:${TTYD_PORT:-7681}:7681"
    command:
      - sh
      - -c
      - |
        [ -x /home/agent/.local/bin/ttyd ] || curl -fsSL -o /home/agent/.local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 && chmod +x /home/agent/.local/bin/ttyd
        cd /gt
        gt dashboard >/tmp/dashboard.log 2>&1 &
        /home/agent/.local/bin/ttyd -W -p 7681 gt mayor attach >/tmp/ttyd.log 2>&1 &
        exec sleep infinity

volumes:
  gt:
